site_name: DevOps @ FHV
site_description: Dokumentation des DevOps Projekts (Team ryannilsemiliemelsimyurt)
site_author: Team ryannilsemiliemelsimyurt

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark Mode einschalten
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light Mode einschalten

nav:
  - Start: index.md
  - Notizen: notes.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
