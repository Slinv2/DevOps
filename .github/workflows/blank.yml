name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    env:
      REGISTRY: 10.0.40.171:5000
      IMAGE_NAME: docker-java-jar-ryannilsemiliemelsimyurt
      IMAGE_TAG: ${{ github.run_number }}
      DOCS_IMAGE_NAME: ryannilsemiliemelsimyurt-docs
      DOCS_IMAGE_TAG: ${{ github.run_number }}

    steps:
      - name: reset permissions
        run: docker run --rm -v "$PWD":/project bash:latest chown --recursive $(id -u):$(id -g) /project

      - uses: actions/checkout@v6

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Build PDF
        run: |
          docker run --rm \
           --volume "$(pwd):/data" \
           --user $(id -u):$(id -g) \
           pandoc/latex README.md -o outfile.pdf

      - name: Build Java application
        run: |
          cp outfile.pdf src/main/resources/static/doc.pdf
          docker run --rm -u gradle -v "$PWD":/home/gradle/project -w /home/gradle/project gradle:jdk17 gradle build

      # Build documentation: mkdocs-material container produces the static site/ folder
      - name: Build documentation (MkDocs)
        run: |
          docker run --rm -v "$PWD":/docs squidfunk/mkdocs-material build --clean --strict

      # SonarQube analysis
      - name: SonarQube scan
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL="http://10.0.40.167:9000" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "$PWD":/usr/src \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=ryannilsemiliemelsim \
            -Dsonar.sources=src/main \
            -Dsonar.tests=src/test \
            -Dsonar.java.binaries=build/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

      - name: Build Docker Image
        run: docker image build -t "$IMAGE_NAME:$IMAGE_TAG" .

      # Build the documentation image based on nginx, serving the generated site/ folder
      - name: Build Documentation Docker Image
        run: |
          docker run --rm -v "$PWD":/project bash:latest chown --recursive $(id -u):$(id -g) /project 
          cp outfile.pdf site/doc.pdf
          docker image build -f Dockerfile.docs -t "$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG" .

      # 1. Graceful Interrupt
      - name: Interrupt and Stop existing container
        run: |
          if [ $(docker ps -q -f name=ryannilsemiliemelsimyurtcontainer) ]; then
            echo "Gracefully stopping container..."
            docker stop --time=10 ryannilsemiliemelsimyurtcontainer || true
          fi

      # 2. Cleanup / Removal
      - name: Remove stopped container
        run: |
          if [ $(docker ps -a -q -f name=ryannilsemiliemelsimyurtcontainer) ]; then
            echo "Removing existing container..."
            docker rm -f ryannilsemiliemelsimyurtcontainer || true
          fi

      # 3. Start Container (Detached Mode)
      - name: Run new container
        run: |
          docker run -d --name ryannilsemiliemelsimyurtcontainer -p 8080:8080 --restart unless-stopped "$IMAGE_NAME:$IMAGE_TAG"

      # 4. Integration test: compare live endpoint output against expected fixture
      - name: Integration test /api/status endpoint
        run: |
          expected=$(cat expected/status.json | tr -d '\r\n')
          for i in $(seq 1 30); do
            actual=$(curl -s http://localhost:8080/api/status | tr -d '\r\n')
            if [ "$expected" == "$actual" ]; then
              echo "Integration test passed after ${i}s"
              exit 0
            fi
            echo "Attempt ${i}: expected '$expected' but got '$actual', retrying..."
            sleep 1
          done
          echo "Integration test failed after 30 attempts"
          exit 1

      # 5. Tag and push image to the team Docker registry 123
      - name: Push image to registry
        run: |
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      # ----- Documentation container deployment -----

      # 6. Graceful Interrupt of existing documentation container
      - name: Interrupt and Stop existing documentation container
        run: |
          if [ $(docker ps -q -f name=ryannilsemiliemelsimyurtdocs) ]; then
            echo "Gracefully stopping documentation container..."
            docker stop --time=10 ryannilsemiliemelsimyurtdocs || true
          fi

      # 7. Cleanup / Removal of stopped documentation container
      - name: Remove stopped documentation container
        run: |
          if [ $(docker ps -a -q -f name=ryannilsemiliemelsimyurtdocs) ]; then
            echo "Removing existing documentation container..."
            docker rm -f ryannilsemiliemelsimyurtdocs || true
          fi

      # 8. Start documentation container on a different port than the application (8081 -> 80)
      - name: Run new documentation container
        run: |
          docker run -d --name ryannilsemiliemelsimyurtdocs -p 8081:80 --restart unless-stopped "$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG"

      # 9. Tag and push documentation image to the team Docker registry
      - name: Push documentation image to registry
        run: |
          docker tag "$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG" "$REGISTRY/$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG"
          docker push "$REGISTRY/$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG"

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      REGISTRY: 10.0.40.171:5000
      IMAGE_NAME: docker-java-jar-ryannilsemiliemelsimyurt
      IMAGE_TAG: ${{ github.run_number }}
      DOCS_IMAGE_NAME: ryannilsemiliemelsimyurt-docs
      DOCS_IMAGE_TAG: ${{ github.run_number }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan 10.0.40.173 >> "$HOME/.ssh/known_hosts_deploy"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_deploy" \
            team5@10.0.40.173 \
            "set -e
            echo "Deploying app" 
            
            docker pull '$REGISTRY/$IMAGE_NAME:$IMAGE_TAG'
            docker rm -f ryannilsemiliemelsimyurtcontainer-app || true
            docker run -d --name ryannilsemiliemelsimyurtcontainer-app -p 1851:8080 --restart unless-stopped '$REGISTRY/$IMAGE_NAME:$IMAGE_TAG'
            echo "Deploying docs" 
            docker pull '$REGISTRY/$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG'
            docker rm -f ryannilsemiliemelsimyurtcontainer-docs || true
            docker run -d --name ryannilsemiliemelsimyurtcontainer-docs -p 1852:80 --restart unless-stopped '$REGISTRY/$DOCS_IMAGE_NAME:$DOCS_IMAGE_TAG'
          "
          rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts_deploy"
