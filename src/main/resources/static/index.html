<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer hat den Build kaputt gemacht?</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
        background-size: 400% 400%;
        animation: bgShift 12s ease infinite;
        color: #1e1e2f;
        padding: 2rem;
        text-align: center;
    }

    @keyframes bgShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
        font-size: 2.4rem;
        background: #fff;
        padding: 1rem 2rem;
        border-radius: 20px;
        box-shadow: 0 10px 0 #1e1e2f;
        margin-bottom: 2rem;
        transform: rotate(-2deg);
    }

    .suspects {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
        margin-bottom: 2rem;
    }

    .suspect {
        background: #fff;
        border: 4px solid #1e1e2f;
        border-radius: 16px;
        padding: 1.2rem 1.5rem;
        width: 160px;
        box-shadow: 6px 6px 0 #1e1e2f;
        transition: transform 0.15s ease;
        cursor: default;
    }

    .suspect:hover {
        transform: translate(-3px, -3px) rotate(-1deg);
    }

    .suspect .emoji {
        font-size: 2.5rem;
    }

    .suspect .name {
        font-weight: bold;
        margin-top: 0.5rem;
        font-size: 1.1rem;
    }

    .suspect .role {
        font-size: 0.8rem;
        color: #555;
        margin-top: 0.3rem;
    }

    button {
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        padding: 0.9rem 1.8rem;
        border: 4px solid #1e1e2f;
        border-radius: 999px;
        background: #ff6b6b;
        color: #1e1e2f;
        cursor: pointer;
        box-shadow: 5px 5px 0 #1e1e2f;
        transition: transform 0.1s ease;
    }

    button:active {
        transform: translate(5px, 5px);
        box-shadow: 0 0 0 #1e1e2f;
    }

    #verdict {
        margin-top: 2rem;
        font-size: 1.6rem;
        font-weight: bold;
        background: #fff;
        padding: 1rem 1.6rem;
        border-radius: 16px;
        border: 4px solid #1e1e2f;
        box-shadow: 6px 6px 0 #1e1e2f;
        min-height: 2rem;
        display: none;
    }

    #verdict.show {
        display: inline-block;
        animation: pop 0.3s ease;
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
</head>
<body>
<h1>🔥 Wer hat die Pipeline zerschossen? 🔥</h1>

<div class="suspects">
    <div class="suspect">
        <div class="emoji">🧑‍💻</div>
        <div class="name">Ryan</div>
        <div class="role">behauptet "läuft bei mir"</div>
    </div>
    <div class="suspect">
        <div class="emoji">👩‍🔬</div>
        <div class="name">Emilie</div>
        <div class="role">hat "nur eine Kleinigkeit" gemerged</div>
    </div>
    <div class="suspect">
        <div class="emoji">🧔</div>
        <div class="name">Nils</div>
        <div class="role">war "nur mal kurz am main branch"</div>
    </div>
    <div class="suspect">
        <div class="emoji">🕵️</div>
        <div class="name">Melsimyurt</div>
        <div class="role">der stille Commit-Champion</div>
    </div>
</div>

<button onclick="verdict()">🎲 Schuldigen ermitteln</button>

<div id="verdict"></div>

<script>
    const suspects = [
        { name: "Ryan", excuse: "weil er ein 'quick fix' ohne Tests gepusht hat 🙈" },
        { name: "Emilie", excuse: "weil ihr Force-Push den main branch gelöscht hat 💥" },
        { name: "Nils", excuse: "weil er die .env Datei committed hat 🔑" },
        { name: "Melsimyurt", excuse: "weil er um 23:59 Uhr noch 'ein letztes Feature' reingedrückt hat 🌙" }
    ];

    function verdict() {
        const el = document.getElementById('verdict');
        const pick = suspects[Math.floor(Math.random() * suspects.length)];
        el.textContent = `🚨 ${pick.name} war's — ${pick.excuse}`;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }
</script>
</body>
</html>
